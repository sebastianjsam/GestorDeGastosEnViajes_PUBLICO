<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f7a5f"/>
      <stop offset="100%" stop-color="#0a5c47"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,240)" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- House roof -->
    <path d="M-120,-40 L0,-140 L120,-40" fill="none"/>
    <!-- House body -->
    <rect x="-100" y="-40" width="200" height="140" rx="8" fill="rgba(255,255,255,0.15)"/>
    <!-- Door -->
    <rect x="-25" y="20" width="50" height="80" rx="6" fill="rgba(255,255,255,0.2)"/>
    <!-- Windows -->
    <rect x="-75" y="-15" width="35" height="35" rx="4" fill="rgba(255,255,255,0.2)"/>
    <rect x="40" y="-15" width="35" height="35" rx="4" fill="rgba(255,255,255,0.2)"/>
    <!-- Dollar sign -->
    <text x="0" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="55" font-weight="bold" fill="#fff" stroke="none">$</text>
  </g>
</svg>
